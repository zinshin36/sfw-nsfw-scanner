name: Build Windows ONEDIR

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create model folder
        run: mkdir model

      - name: Download DeepDanbooru Model
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/KichangKim/DeepDanbooru/releases/download/v3-20211112-sgd-e28/deepdanbooru-v3-20211112-sgd-e28.zip" `
            -OutFile "model.zip"

          Expand-Archive -Path "model.zip" -DestinationPath "model" -Force
          Remove-Item "model.zip"

      - name: Build EXE
        run: pyinstaller --clean app.spec

      - name: Show dist folder
        run: Get-ChildItem -Recurse dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraStrictSorter
          path: dist/UltraStrictSorter/
