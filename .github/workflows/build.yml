name: Build Windows EXE

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Build with PyInstaller
        run: |
          python -m pip install -r requirements.txt
          pyinstaller --onefile --windowed --hidden-import="numpy" app.py

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      
      - name: Build EXE
        run: |
          pyinstaller app.spec

      - name: Create logs directory
        run: |
          mkdir -p dist\app\logs

      - name: Show dist folder
        run: |
          echo ==== DIST RECURSIVE ====
          Get-ChildItem -Recurse dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/

      - name: Check for build errors and logs
        if: always()
        run: |
          echo ==== CHECKING FOR BUILD LOGS ====
          if (Test-Path "dist\app\logs") {
            Get-ChildItem -Recurse dist\app\logs
          } else {
            echo "No logs directory created"
          }
          if (Test-Path "build") {
            echo "==== BUILD FOLDER CONTENTS ===="
            Get-ChildItem -Recurse build
          }
