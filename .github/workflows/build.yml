name: Build Windows ONEDIR

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # -------------------------------
      # DOWNLOAD MODEL (NO RECURSION)
      # -------------------------------
      - name: Download DeepDanbooru Model
        shell: pwsh
        run: |
          Write-Host "Downloading DeepDanbooru model..."

          Invoke-WebRequest `
            -Uri "https://github.com/KichangKim/DeepDanbooru/releases/download/v3-20211112-sgd-e28/deepdanbooru-v3-20211112-sgd-e28.zip" `
            -OutFile "model.zip"

          Expand-Archive -Path "model.zip" -DestinationPath "." -Force
          Remove-Item "model.zip"

          # Rename extracted folder to 'model'
          $extracted = Get-ChildItem -Directory | Where-Object { $_.Name -like "deepdanbooru-*" } | Select-Object -First 1
          Rename-Item $extracted.FullName "model"

          Write-Host "Model contents:"
          Get-ChildItem -Recurse model

      # -------------------------------
      # BUILD EXE (ONEDIR SAFE)
      # -------------------------------
      - name: Build EXE
        run: |
          pyinstaller --clean app.spec

      - name: Show dist folder
        run: |
          Write-Host "==== DIST STRUCTURE ===="
          Get-ChildItem -Recurse dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/app/
