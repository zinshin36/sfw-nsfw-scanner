name: Build Windows EXE (Python 3.10.11)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10.11"
          architecture: "x64"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Download DeepDanbooru Pretrained Model
        run: |
          curl -L -o model.zip https://github.com/KichangKim/DeepDanbooru/releases/download/v3-20211112-sgd-e28/deepdanbooru-v3-20211112-sgd-e28.zip
          tar -xf model.zip || powershell Expand-Archive model.zip -DestinationPath .
          ren deepdanbooru-v3-20211112-sgd-e28 model

      - name: Install PyInstaller
        run: pip install pyinstaller==6.6.0

      - name: Build
        run: pyinstaller --clean --noconfirm app.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/sfw_nsfw_sorter/
