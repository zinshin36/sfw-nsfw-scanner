name: Build Windows EXE (Python 3.10.11)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10.11"
          architecture: "x64"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Download DeepDanbooru Pretrained Model
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/KichangKim/DeepDanbooru/releases/download/v3-20211112-sgd-e28/deepdanbooru-v3-20211112-sgd-e28.zip" `
            -OutFile "model.zip"

          Expand-Archive -Path model.zip -DestinationPath extracted

          $folder = Get-ChildItem extracted | Where-Object { $_.PSIsContainer } | Select-Object -First 1

          Rename-Item $folder.FullName model

          Remove-Item model.zip
          Remove-Item extracted -Recurse -Force

      - name: Install PyInstaller
        run: pip install pyinstaller==6.6.0

      - name: Build
        run: pyinstaller --clean --noconfirm app.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/sfw_nsfw_sorter/
